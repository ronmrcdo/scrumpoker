name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Supplied so env.ts validation passes during build/test.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format & lint
        run: pnpm format-and-lint

      - name: DB types are fresh
        # Starts a local Supabase stack, regenerates types from current
        # migrations, and diffs against the committed file. Fails if
        # apps/web/lib/database.types.ts is stale relative to migrations.
        run: |
          pnpm exec supabase start --exclude=imgproxy,pooler,vector,studio,inbucket,storage-api,edge-runtime,logflare,realtime-dev
          pnpm db:types:check
          pnpm exec supabase stop --no-backup

      - name: Type-check
        run: pnpm check-types

      - name: Tests
        run: pnpm test:run
